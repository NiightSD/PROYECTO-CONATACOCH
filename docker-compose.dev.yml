# =============================================================================
# CONATACOCH - Override de desarrollo local
# -----------------------------------------------------------------------------
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Expone el backend directamente en el host para depurar el API sin pasar por
# Nginx. Mantiene la imagen stateless (no monta codigo fuente).
# =============================================================================
services:
  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DEBUG: "True"

  web_admin:
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
