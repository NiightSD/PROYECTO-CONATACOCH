# Proyecto Android CONATACOCH
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# URL de la API usada por la app.
# Emulador Android Studio -> 10.0.2.2 apunta al host (Django en el puerto 8000).
# Dispositivo fisico -> reemplazar por la IP LAN del equipo, por ejemplo:
#   CONATACOCH_API_BASE_URL=http://192.168.1.50:8000/api/
CONATACOCH_API_BASE_URL=http://10.0.2.2:8000/api/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
