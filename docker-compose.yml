# =============================================================================
# CONATACOCH - Fase 1: infraestructura base escalable
# -----------------------------------------------------------------------------
# Servicios:
#   db_mysql    : MySQL 8.0 con volumen persistente y healthcheck.
#   backend     : Django 5 + DRF + drf-spectacular (stateless, pool de conexiones).
#   web_admin   : Nginx que sirve web-admin/ y actua como reverse proxy del API.
#   mongo_local : MongoDB 8 opcional (perfil "mongo-local") usado SOLO como
#                 fallback cuando MONGO_ATLAS_URI esta vacio.
#
# Produccion : docker compose up -d --build
# Fallback   : docker compose --profile mongo-local up -d --build
# Escalar    : docker compose up -d --scale backend=3
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-conatacoch}

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0 - persistencia relacional normalizada (3FN)
  # ---------------------------------------------------------------------------
  db_mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --max-connections=300
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_conatacoch_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-conatacoch}
      MYSQL_USER: ${MYSQL_USER:-conatacoch}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-conatacoch_2026}
    ports:
      # Solo para inspeccion local. En produccion eliminar esta publicacion.
      - "${MYSQL_EXPOSED_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - conatacoch_net

  # ---------------------------------------------------------------------------
  # MongoDB local - FALLBACK opcional (perfil mongo-local)
  # ---------------------------------------------------------------------------
  mongo_local:
    image: mongo:8.0
    profiles: ["mongo-local"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-telemetria_ubicacion}
    ports:
      - "${MONGO_LOCAL_EXPOSED_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - conatacoch_net

  # ---------------------------------------------------------------------------
  # Backend Django/DRF - 100% stateless, escalable horizontalmente
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-production}
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,web_admin}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      # MySQL: el host se fuerza al nombre del servicio compose.
      MYSQL_HOST: db_mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-conatacoch}
      MYSQL_USER: ${MYSQL_USER:-conatacoch}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-conatacoch_2026}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-600}
      DB_WAIT_RETRIES: ${DB_WAIT_RETRIES:-30}
      DB_WAIT_DELAY: ${DB_WAIT_DELAY:-2}
      # MongoDB: Atlas si hay URI, si no fallback al contenedor local.
      MONGO_ATLAS_URI: ${MONGO_ATLAS_URI:-}
      MONGO_LOCAL_URI: ${MONGO_LOCAL_URI:-mongodb://mongo_local:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-telemetria_ubicacion}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-ubicaciones}
      MONGO_TTL_SECONDS: ${MONGO_TTL_SECONDS:-14400}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-50}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-5}
      MONGO_TIMEOUT_MS: ${MONGO_TIMEOUT_MS:-5000}
      # Carga inicial idempotente.
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DATA_FILE: ${SEED_DATA_FILE:-/app/data/recorridos_conatacoch_taxi_colectivo_2.json}
      SEED_TARIFA_URBANA: ${SEED_TARIFA_URBANA:-1000}
      SEED_TARIFA_RURAL: ${SEED_TARIFA_RURAL:-1500}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    depends_on:
      db_mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live/', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - conatacoch_net

  # ---------------------------------------------------------------------------
  # Web Admin - Nginx (estaticos + reverse proxy /api, /admin, /static)
  # ---------------------------------------------------------------------------
  web_admin:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_ADMIN_PORT:-8080}:80"
    volumes:
      - ./web-admin/index.html:/usr/share/nginx/html/index.html:ro
      - ./web-admin/assets:/usr/share/nginx/html/assets:ro
      - ./web-admin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - conatacoch_net

volumes:
  mysql_data:
    name: conatacoch_mysql_data
  mongo_data:
    name: conatacoch_mongo_data

networks:
  conatacoch_net:
    name: conatacoch_net
    driver: bridge
